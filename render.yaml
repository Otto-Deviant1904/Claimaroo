# Render Blueprint — web service + Postgres 16 (docs/technical-requirements.md).
# Apply from the Render dashboard: New → Blueprint → this repo.
# Starter web + basic-256mb Postgres: pre-deploy (schema/seed) is paid-only,
# and free web instances spin down after 15 minutes.

databases:
  - name: claimaroo-db
    postgresMajorVersion: "16"
    region: singapore
    plan: basic-256mb
    databaseName: claims
    ipAllowList: []

services:
  - type: web
    name: claimaroo
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:release
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: claimaroo-db
          property: connectionString
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_AGENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LOCAL_VISION_URL
        sync: false
